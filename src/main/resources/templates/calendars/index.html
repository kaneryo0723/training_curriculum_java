<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <link th:href="@{/css/reset.css}" rel="stylesheet" type="text/css">
</head>

<body>
  <div>
    <form th:action="@{/calendars}" th:object="${planForm}" method="post">
      <label for="date">日付を選択</label>
      <input type="date" th:field="*{date}" class="date-select"/>
      
      <label for="plan">予定を入力</label>
      <input type="text"  th:field="*{plan}" class="text-input"/>
      
      <button type="submit">保存</button>
    </form>
  </div>
  <div>
    <div class="calendar">
      <div th:each="day : ${weekDays}">
        <div class="item">
          <div class="date">
            <span th:text="'/'"></span>
          </div>
          <ul class="content">
            <li th:each="plan : ${day.plans}" class="plan-list">・<span th:text="${plan}"></span></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
